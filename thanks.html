<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent - Biomed Club</title>
    
    <meta http-equiv="refresh" content="4;url=https://biomedclub.github.io/BioMedClub/index.html">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; }
        .loader {
            border: 4px f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            display: inline-block;
            margin-top: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thank You!</h1>
        <p>Your message has been received. We will get back to you shortly.</p>
        <p>Redirecting you back to the home page in <span id="countdown">4</span> seconds...</p>
        <div class="loader"></div>
    </div>

    <script>
        // Optional: Simple countdown timer visual
        let timeLeft = 4;
        const downloadTimer = setInterval(function(){
            if(timeLeft <= 0){
                clearInterval(downloadTimer);
            } else {
                document.getElementById("countdown").innerHTML = timeLeft;
            }
            timeLeft -= 1;
        }, 1000);
    </script>
</body>
</html>
